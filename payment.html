<script>


let currentStep = 1;

let selectedMethod = "";

let selectedAccount = "";



const accounts = {

    "PayPal": {
        name:"ModdingXZ PayPal",
        address:"paypal.me/MrJasonDEX",
        url:"https://paypal.me/MrJasonDEX"
    },

    "Revolut": {
        name:"ModdingXZ Revolut",
        address:"revolut.me/moddingxz",
        url:"https://revolut.me/moddingxz"
    },

    "Cash App": {
        name:"Cash App",
        address:"$Crouse0612",
        url:"https://cash.app/$Crouse0612"
    }

};





function renderStep(){


document
.querySelectorAll(".step")
.forEach(step=>{

    step.classList.remove("active");

});


document
.getElementById(
"step"+currentStep
)
.classList.add("active");



document
.querySelectorAll(".progress-item")
.forEach((item,index)=>{


item.classList.remove(
"active",
"done"
);


if(index+1 === currentStep){

    item.classList.add("active");

}


if(index+1 < currentStep){

    item.classList.add("done");

}


});


}





function nextStep(){


if(currentStep === 1){


let amount =
document.getElementById("amount").value;


if(!amount || amount <= 0){

alert(
"Please enter a valid amount."
);

return;

}


}




if(currentStep === 2 && !selectedMethod){


alert(
"Please select a payment method."
);


return;


}





if(currentStep === 3 && !selectedAccount){


alert(
"Please select an account."
);


return;


}





if(currentStep < 4){

currentStep++;

renderStep();

}



if(currentStep === 3){

loadAccount();

}


if(currentStep === 4){

loadSummary();

}



}





function previousStep(){


if(currentStep > 1){

currentStep--;

renderStep();

}


}





function selectMethod(method){


selectedMethod = method;


selectedAccount =
accounts[method];


document.getElementById(
"accountBox"
).innerHTML = `

<h3>${selectedAccount.name}</h3>

<p style="color:#9696a7;margin-top:8px">

${selectedAccount.address}

</p>


<button
class="nav-button"
style="margin-top:15px"
onclick="copyAccount()">

Copy

</button>

`;


}





function loadAccount(){


if(!selectedAccount){

return;

}


}





function loadSummary(){


let amount =
document.getElementById(
"amount"
).value;



document.getElementById(
"summary"
).innerHTML = `


<p>
<b>Amount:</b>
£${amount}
</p>


<p style="margin-top:10px">
<b>Method:</b>
${selectedMethod}
</p>


<p style="margin-top:10px">
<b>Account:</b>
${selectedAccount.name}
</p>


<p style="margin-top:10px;color:#9696a7">

You will be redirected to the official payment page.

</p>


`;

}





function openPayment(){


if(!selectedAccount){

return;

}



window.open(

selectedAccount.url,

"_blank",

"noopener,noreferrer"

);


}





function copyAccount(){


navigator.clipboard.writeText(

selectedAccount.address

);


alert(
"Payment details copied!"
);


}





function goHome(){


window.location.href =
"index.html";


}





function openSupport(){


window.open(

"https://t.me/ModdingXZ_Support_Bot",

"_blank"

);


}






window.addEventListener(
"load",
()=>{


setTimeout(()=>{


document
.getElementById("loader")
.classList.add("hide");


},700);



}

);



</script>


</body>
</html>
