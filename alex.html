<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unreleased Playlist</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .hero {
      padding: 60px 20px 30px;
      text-align: center;
    }

    .embed-box {
      height: 75vh;
      max-width: 900px;
      margin: auto;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loader {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #111;
      text-align: center;
      padding: 20px;
    }

    .btn-custom {
      background: #fff;
      color: #000;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 20px;
      text-decoration: none;
    }

    .btn-custom:hover {
      background: #ddd;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>🎧 Unreleased Playlist</h1>
    <p class="text-secondary">Listen to exclusive content from Alex Warren</p>
  </div>

  <div class="embed-box">

    <!-- Loader -->
    <div id="loader" class="loader">
      <div class="spinner-border text-light"></div>
    </div>

    <!-- Iframe -->
    <iframe 
      id="frame"
      src="https://alexwarren.lnk.to/FFOTRVinyl"
      onload="loaded()">
    </iframe>

    <!-- Fallback -->
    <div id="fallback" class="fallback">
      <h4 class="mb-3">⚠️ Preview not available inside site</h4>
      <p class="mb-4 text-secondary">Tap below to open the playlist</p>
      <a href="https://alexwarren.lnk.to/FFOTRVinyl" target="_blank" class="btn-custom">
        Open Playlist
      </a>
    </div>

  </div>

  <footer>
    <p>Fan page • Not affiliated</p>
  </footer>

  <script>
    function loaded() {
      document.getElementById("loader").style.display = "none";
    }

    // Detect iframe block
    setTimeout(() => {
      const iframe = document.getElementById("frame");

      try {
        let test = iframe.contentWindow.location.href;
      } catch (e) {
        document.getElementById("fallback").style.display = "flex";
        document.getElementById("loader").style.display = "none";
        iframe.style.display = "none";
      }
    }, 3000);
  </script>

</body>
</html>
