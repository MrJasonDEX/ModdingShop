<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreleased Playlist</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(180deg, #0d0d0d, #000);
  color: #fff;
  font-family: system-ui;
}

.navbar {
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
}

.hero {
  padding: 80px 20px 40px;
  text-align: center;
}

.hero h1 {
  font-size: 36px;
  font-weight: bold;
}

.hero p {
  color: #aaa;
}

.player {
  max-width: 700px;
  margin: auto;
  background: #181818;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.cover {
  width: 100%;
  border-radius: 14px;
  margin-bottom: 20px;
}

.title {
  font-size: 24px;
  font-weight: bold;
}

.artist {
  color: #aaa;
  margin-bottom: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  margin: 20px 0;
}

.play-btn {
  background: #1db954;
  border: none;
  padding: 16px 22px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: bold;
  color: #000;
  cursor: pointer;
}

.progress {
  height: 6px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #1db954;
}

.time {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #aaa;
}

.tracklist {
  margin-top: 20px;
}

.track {
  padding: 12px;
  border-bottom: 1px solid #2a2a2a;
  cursor: pointer;
}

.track:hover {
  background: #222;
}

.cta {
  margin-top: 25px;
  text-align: center;
}

.cta a {
  display: inline-block;
  padding: 12px 20px;
  background: #fff;
  color: #000;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

footer {
  margin-top: 60px;
  text-align: center;
  color: #666;
  padding-bottom: 30px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand mb-0 h1">🎧 Music Hub</span>
</nav>

<div class="hero">
  <h1>Unreleased Playlist</h1>
  <p>Exclusive content from Alex Warren</p>
</div>

<div class="player">

  <img class="cover" src="https://i.imgur.com/8Km9tLL.jpg">

  <div class="title">Unreleased Playlist</div>
  <div class="artist">Alex Warren</div>

  <div class="controls">
    <button class="play-btn" onclick="togglePlay()">▶</button>
  </div>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="time">
    <span id="current">0:00</span>
    <span>2:30</span>
  </div>

  <div class="tracklist">
    <div class="track" onclick="playTrack()">1. Track One</div>
    <div class="track" onclick="playTrack()">2. Track Two</div>
    <div class="track" onclick="playTrack()">3. Track Three</div>
    <div class="track" onclick="playTrack()">4. Track Four</div>
  </div>

  <div class="cta">
    <a href="https://alexwarren.lnk.to/FFOTRVinyl" target="_blank">
      Open Official Playlist
    </a>
  </div>

</div>

<footer>
  <p>Fan-made site • Not affiliated</p>
</footer>

<script>
let playing = false;
let progress = 0;
let interval;

function togglePlay() {
  const btn = document.querySelector('.play-btn');

  if (!playing) {
    playing = true;
    btn.innerHTML = "⏸";
    interval = setInterval(updateProgress, 200);
  } else {
    playing = false;
    btn.innerHTML = "▶";
    clearInterval(interval);
  }
}

function updateProgress() {
  if (progress >= 100) {
    clearInterval(interval);
    return;
  }

  progress += 0.5;
  document.getElementById("bar").style.width = progress + "%";

  let seconds = Math.floor((progress / 100) * 150);
  let mins = Math.floor(seconds / 60);
  let secs = seconds % 60;

  document.getElementById("current").innerText =
    mins + ":" + (secs < 10 ? "0" : "") + secs;
}

function playTrack() {
  progress = 0;
  document.getElementById("bar").style.width = "0%";
  document.getElementById("current").innerText = "0:00";
}
</script>

</body>
</html>
