<!doctype html>
<html class="landing" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08060d" />

    <title>Afterglow | PS4 Exploit</title>

    <meta
      name="description"
      content="Afterglow PS4 exploit launcher for supported firmware. Select a payload and start manually."
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header id="brand">
      <b>afterglow</b>
    </header>

    <div class="shell">
      <img
        class="meme"
        src="meme.png"
        alt=""
        aria-hidden="true"
      />

      <main class="panel">
        <p class="lede">
          PS4 kernel exploit
          <span aria-hidden="true">&middot;</span>
          firmware 13.52 and 14.00
        </p>

        <p class="notice" role="note">
          Experimental software. Compatibility and successful execution are
          not guaranteed. Use at your own risk.
        </p>

        <form class="pick" id="pick">
          <fieldset class="payload-options">
            <legend class="visually-hidden">Choose a payload</legend>

            <label class="opt">
              <input
                type="radio"
                name="payload"
                value="hen"
              />
              <span>ps4-hen</span>
            </label>

            <label class="opt">
              <input
                type="radio"
                name="payload"
                value="goldhen"
                checked
              />
              <span>GoldHEN</span>
            </label>
          </fieldset>

          <label class="opt opt-auto" for="auto">
            <input
              type="checkbox"
              id="auto"
              name="autostart"
              checked
            />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">
            start
          </button>

          <p
            class="count"
            id="count"
            aria-live="polite"
            aria-atomic="true"
          ></p>
        </form>
      </main>
    </div>

    <footer class="byline">
      by well0nez/m0zz
    </footer>

    <script src="launch.js"></script>
  </body>
</html>
