
<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#07050b">

    <title>MODDING XZ // AFTERGLOW HOST</title>

    <!--
        Self-contained exploit page.
        No external stylesheets, fonts, images or scripts.

        IMPORTANT:
        Keep the existing element IDs and jb.js import intact.
        jb.js controls the body classes: .log, .done and .fail.
    -->

    <style>
        :root {
            --mx-bg: #07050b;
            --mx-bg2: #0d0914;
            --mx-panel: #110d19;
            --mx-panel2: #171020;

            --mx-purple: #9147ff;
            --mx-purple2: #b06cff;
            --mx-purple3: #d0a8ff;

            --mx-border: #2a1d3d;
            --mx-border2: #392750;

            --mx-text: #f8f5ff;
            --mx-muted: #aaa0b8;
            --mx-dim: #70667d;

            --mx-green: #55e6a5;
            --mx-red: #ff7777;
            --mx-amber: #e5b85c;

            --sans: "Segoe UI", Arial, Helvetica, sans-serif;
            --mono: Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--mx-bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--mx-text);

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(145, 71, 255, .22),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 100% 45%,
                    rgba(145, 71, 255, .07),
                    transparent 35%
                ),
                linear-gradient(
                    rgba(145, 71, 255, .025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(145, 71, 255, .025) 1px,
                    transparent 1px
                ),
                var(--mx-bg);

            background-size:
                auto,
                auto,
                40px 40px,
                40px 40px;

            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.6;
        }

        /* HEADER */

        #brand {
            position: relative;
            padding: 17px 12px;
            border: 1px solid var(--mx-border);
            border-top: 0;
            background: rgba(13, 9, 20, .96);
            text-align: center;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, .35),
                inset 0 -1px rgba(145, 71, 255, .08);
        }

        #brand::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--mx-purple),
                transparent
            );

            opacity: .8;
        }

        #brand b {
            color: var(--mx-text);
            font-family: var(--sans);
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.06em;
            text-transform: uppercase;
        }

        #brand b::first-letter {
            color: var(--mx-purple);
        }

        /* MEMORY / RAM READOUT */

        #ramBox {
            position: relative;
            z-index: 1;
            overflow: hidden;

            min-height: 33px;
            padding: 7px 13px;

            border-bottom: 1px solid var(--mx-border);
            background: rgba(13, 9, 20, .95);

            color: var(--mx-green);
            font: 10px/1.7 var(--mono);

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* LOADING SPINNER */

        #spin {
            position: fixed;
            top: calc(50% + 20px);
            left: 50%;

            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;

            border: 3px solid var(--mx-border);
            border-top-color: var(--mx-purple);
            border-right-color: var(--mx-purple2);
            border-radius: 50%;

            animation: mx-spin .9s linear infinite;

            box-shadow:
                0 0 22px rgba(145, 71, 255, .12);
        }

        @keyframes mx-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* RESULT MESSAGE */

        #msg {
            position: fixed;
            top: 50%;
            left: 0;
            right: 0;

            display: none;
            transform: translateY(-50%);

            padding: 20px;

            color: var(--mx-purple3);
            font-family: var(--sans);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: .04em;
            text-align: center;
            text-transform: uppercase;
        }

        #state,
        #out {
            display: none;
        }

        /* SUCCESS */

        body.done #spin,
        body.fail #spin {
            display: none;
        }

        body.done #msg {
            display: block;
            color: var(--mx-green);
        }

        /* FAILURE */

        body.fail #msg {
            display: block;
            color: var(--mx-red);
        }

        /* DEBUG / LOG MODE */

        body.log {
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
        }

        body.log #spin,
        body.log #msg {
            display: none;
        }

        body.log #wrap {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;

            width: min(100% - 30px, 1100px);
            margin: 22px auto 35px;
            padding: 20px;

            border: 1px solid var(--mx-border);
            border-left: 2px solid var(--mx-purple);

            background:
                linear-gradient(
                    110deg,
                    rgba(145, 71, 255, .07),
                    transparent 60%
                ),
                var(--mx-panel);

            box-shadow: 0 20px 55px rgba(0, 0, 0, .2);
        }

        body.log #state {
            display: block;

            margin: 0 0 13px;
            padding-bottom: 12px;

            border-bottom: 1px solid var(--mx-border);

            color: var(--mx-purple3);
            font-family: var(--sans);
            font-size: 22px;
            font-weight: 900;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        body.log #out {
            display: block;
            flex: 1;
            min-height: 0;
            width: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            margin: 0;
            padding: 15px;

            border: 1px solid var(--mx-border);
            background: rgba(7, 5, 11, .92);

            color: #c8b7df;
            font: 10px/1.7 var(--mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        body.log #out::-webkit-scrollbar {
            width: 6px;
        }

        body.log #out::-webkit-scrollbar-track {
            background: var(--mx-bg);
        }

        body.log #out::-webkit-scrollbar-thumb {
            background: var(--mx-border2);
        }

        /* RETRY / ERROR NOTICE */

        .notice {
            margin: 1em 0;
            padding: .8em 1em;

            border: 1px solid rgba(255, 119, 119, .6);
            border-left: 3px solid var(--mx-red);

            background: rgba(255, 119, 119, .08);
            color: var(--mx-red);

            font: 700 16px/1.5 var(--sans);
        }

        /* STATUS COLOURS */

        .ok {
            color: var(--mx-purple2);
        }

        .bad {
            color: var(--mx-red);
        }

        .warn {
            color: var(--mx-amber);
        }

        code {
            padding: 2px 5px;
            border: 1px solid var(--mx-border);
            background: var(--mx-panel2);
            color: var(--mx-purple3);
            font-family: var(--mono);
        }

        /* FOOTER */

        .byline {
            position: fixed;
            bottom: 9px;
            left: 12px;
            z-index: 2;

            margin: 0;
            padding: 4px 7px;

            border: 1px solid rgba(42, 29, 61, .7);
            background: rgba(7, 5, 11, .85);

            color: var(--mx-dim);
            font: 9px/1.4 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .byline::before {
            content: "// ";
            color: var(--mx-purple);
        }

        /* MOBILE */

        @media (max-width: 600px) {
            #brand {
                padding: 15px 10px;
            }

            #brand b {
                font-size: 19px;
            }

            #ramBox {
                font-size: 9px;
            }

            body.log #wrap {
                width: calc(100% - 20px);
                margin: 12px auto 30px;
                padding: 13px;
            }

            body.log #state {
                font-size: 18px;
            }

            body.log #out {
                padding: 11px;
                font-size: 9px;
            }

            #msg {
                font-size: 21px;
            }

            .byline {
                bottom: 5px;
                left: 7px;
                font-size: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spin {
                animation-duration: 2s;
            }
        }
    </style>
</head>

<body>

    <!--
        IMPORTANT:
        These IDs are used by jb.js.
        Do not rename or remove them.
    -->

    <div id="brand">
        <b>MODDING XZ</b>
    </div>

    <div id="ramBox">RAM: checking...</div>

    <div id="spin"></div>

    <div id="msg">Restart your console</div>

    <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
    </div>

    <p class="byline">AFTERGLOW // BY WELL0NEZ / M0ZZ</p>

    <!-- EXISTING AFTERGLOW EXPLOIT SCRIPT -->
    <script type="module">
        import "./jb.js";
    </script>

</body>
</html>
