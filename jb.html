<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07050d">

<title>MODDINGXZ // TERMINAL</title>

<!-- External fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- External animation library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js" defer></script>

<style>
/* =========================================================
   MODDINGXZ // ONE FILE TERMINAL
   ========================================================= */

:root {
    --bg: #050308;
    --panel: rgba(13, 8, 20, .94);
    --panel2: rgba(20, 11, 31, .9);
    --purple: #9b5cff;
    --purple2: #c08aff;
    --pink: #ff4fd8;
    --green: #45ff9a;
    --red: #ff5577;
    --yellow: #ffd166;
    --text: #eee7f8;
    --muted: #8e829d;
    --border: rgba(155, 92, 255, .28);
    --shadow: 0 30px 100px rgba(0,0,0,.65);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* MATRIX */

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: .13;
    pointer-events: none;
}

/* VIGNETTE */

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
        radial-gradient(circle at center, transparent 20%, rgba(0,0,0,.55) 100%),
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: auto, 100% 4px;
}

/* MAIN */

.wrapper {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.terminal {
    width: min(940px, 100%);
    min-height: 650px;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(145deg, rgba(22,12,34,.97), rgba(5,3,8,.98));

    border: 1px solid var(--border);
    border-radius: 20px;

    box-shadow:
        var(--shadow),
        0 0 80px rgba(117,54,255,.12),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter: blur(15px);
}

/* TOP BAR */

.topbar {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;

    border-bottom: 1px solid rgba(255,255,255,.06);
    background: rgba(0,0,0,.22);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
}

.logo {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 8px;

    color: #050308;
    background: linear-gradient(135deg, var(--purple2), var(--pink));

    font-size: 13px;
    font-weight: 900;

    box-shadow: 0 0 25px rgba(192,138,255,.25);
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

/* CONTENT */

.content {
    padding: 40px;
}

@media(max-width: 650px) {
    .content {
        padding: 25px 18px;
    }

    .terminal {
        min-height: 600px;
    }
}

/* BOOT */

.boot {
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.boot-inner {
    width: 100%;
    max-width: 650px;
}

.boot-logo {
    color: var(--purple2);
    font-size: clamp(28px, 7vw, 58px);
    font-weight: 800;
    letter-spacing: -3px;
    margin-bottom: 30px;
    text-shadow: 0 0 35px rgba(155,92,255,.4);
}

.boot-line {
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
}

.boot-line span {
    color: var(--green);
}

.progress {
    height: 8px;
    width: 100%;
    margin-top: 20px;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,.05);
}

.progress-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    box-shadow: 0 0 25px rgba(155,92,255,.7);
    transition: width .25s ease;
}

/* SCREENS */

.screen {
    animation: screenIn .35s ease both;
}

@keyframes screenIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.kicker {
    color: var(--purple2);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 14px;
}

.question {
    font-size: clamp(24px, 5vw, 43px);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin: 0 0 15px;
}

.description {
    max-width: 700px;
    color: var(--muted);
    line-height: 1.7;
    font-size: 13px;
    margin-bottom: 30px;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

@media(max-width: 600px) {
    .buttons {
        grid-template-columns: 1fr;
    }
}

.btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.025);
    color: var(--text);

    padding: 18px;
    border-radius: 12px;

    text-align: left;
    font: inherit;
    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
    transition: .2s ease;

    position: relative;
    overflow: hidden;
}

.btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(155,92,255,.12), transparent);
    transform: translateX(-100%);
    transition: .4s ease;
}

.btn:hover::before {
    transform: translateX(100%);
}

.btn:hover {
    border-color: rgba(192,138,255,.7);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.btn:focus-visible {
    outline: 2px solid var(--purple2);
    outline-offset: 3px;
}

.btn .arrow {
    float: right;
    color: var(--purple2);
}

.btn.green:hover {
    border-color: rgba(69,255,154,.7);
}

.btn.danger:hover {
    border-color: rgba(255,85,119,.7);
}

.btn.full {
    grid-column: 1 / -1;
}

/* INFO BOX */

.info {
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    border-radius: 12px;
    padding: 18px;
    margin: 25px 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.info strong {
    color: var(--text);
}

.success {
    color: var(--green);
}

.warning {
    color: var(--yellow);
}

.error {
    color: var(--red);
}

/* RESULT */

.result-icon {
    width: 70px;
    height: 70px;
    display: grid;
    place-items: center;

    margin-bottom: 22px;

    border-radius: 18px;
    background: rgba(69,255,154,.08);
    border: 1px solid rgba(69,255,154,.25);

    color: var(--green);
    font-size: 30px;

    box-shadow: 0 0 40px rgba(69,255,154,.08);
}

.result-icon.purple {
    background: rgba(155,92,255,.08);
    border-color: rgba(155,92,255,.25);
    color: var(--purple2);
}

/* TERMINAL */

.hacker {
    border: 1px solid rgba(255,79,216,.28);
    background: rgba(0,0,0,.45);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(255,0,180,.025);
}

.hacker-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 13px 16px;

    border-bottom: 1px solid rgba(255,255,255,.06);
    background: rgba(255,255,255,.025);

    font-size: 10px;
    color: var(--muted);
}

.hacker-body {
    padding: 20px;
    font-size: 12px;
    line-height: 2;
    min-height: 300px;
}

.prompt {
    color: var(--green);
}

.value {
    color: var(--purple2);
}

.fake-danger {
    color: var(--red);
}

.cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--purple2);
    vertical-align: middle;
    animation: blink .8s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* VISITOR DATA */

.visitor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
}

@media(max-width: 600px) {
    .visitor-grid {
        grid-template-columns: 1fr;
    }
}

.visitor-card {
    padding: 12px;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 9px;
    background: rgba(255,255,255,.02);
}

.visitor-card small {
    display: block;
    color: var(--muted);
    margin-bottom: 5px;
    font-size: 9px;
}

.visitor-card span {
    display: block;
    color: var(--purple2);
    font-size: 11px;
    word-break: break-word;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 20px;

    border-top: 1px solid rgba(255,255,255,.06);

    color: var(--muted);
    font-size: 10px;
}

.footer a {
    color: var(--purple2);
    text-decoration: none;
}

.footer a:hover {
    color: #fff;
}

/* BACK */

.back {
    margin-top: 25px;
    display: inline-block;

    border: 0;
    background: transparent;
    color: var(--muted);

    font: inherit;
    font-size: 10px;

    cursor: pointer;
}

.back:hover {
    color: #fff;
}

/* CLOCK */

.clock {
    position: absolute;
    right: 20px;
    bottom: 15px;

    font-size: 9px;
    color: rgba(255,255,255,.25);
}

/* MOBILE */

@media(max-width: 500px) {
    .topbar {
        padding: 0 14px;
    }

    .brand {
        font-size: 11px;
    }

    .status {
        font-size: 9px;
    }

    .content {
        padding-bottom: 55px;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="wrapper">

    <main class="terminal" id="terminal">

        <header class="topbar">

            <div class="brand">
                <div class="logo">XZ</div>
                MODDINGXZ // TERMINAL
            </div>

            <div class="status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>

        </header>

        <section class="content" id="app">

            <!-- BOOT SCREEN -->

            <div class="boot">

                <div class="boot-inner">

                    <div class="boot-logo">
                        MODDINGXZ
                    </div>

                    <div id="boot-lines"></div>

                    <div class="progress">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>

                </div>

            </div>

        </section>

        <footer class="footer">

            <span>
                MODDINGXZ // PLAYSTATION TERMINAL
            </span>

            <span>
                <a href="https://moddingxz.co.uk" target="_blank">
                    moddingxz.co.uk
                </a>
            </span>

        </footer>

        <div class="clock" id="clock">
            --:--:--
        </div>

    </main>

</div>

<script>
/* =========================================================
   MODDINGXZ // TERMINAL ENGINE
   ========================================================= */

const app = document.getElementById("app");
const progressBar = document.getElementById("progress-bar");
const bootLines = document.getElementById("boot-lines");
const clock = document.getElementById("clock");

const HOST_URL = "https://moddingxz.co.uk/Hosts/index.html";
const SERVICES_URL = "https://moddingxz.co.uk/";
const TELEGRAM_URL = "https://t.me/ModdingXZ";

/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;

function beep(type = "click") {

    try {

        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "success") {
            oscillator.frequency.value = 660;
        } else if (type === "error") {
            oscillator.frequency.value = 140;
        } else {
            oscillator.frequency.value = 330;
        }

        gain.gain.setValueAtTime(.035, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .09
        );

        oscillator.start();
        oscillator.stop(audioContext.currentTime + .09);

    } catch(e) {}
}

/* =========================================================
   BOOT
   ========================================================= */

const bootMessages = [
    "BIOS ................. <span>OK</span>",
    "HOST DATABASE ........ <span>OK</span>",
    "PLAYSTATION MODULE ... <span>OK</span>",
    "SECURITY LAYER ....... <span>OK</span>",
    "TERMINAL ............. <span>READY</span>"
];

let bootIndex = 0;

function bootSequence() {

    if (bootIndex < bootMessages.length) {

        const line = document.createElement("div");

        line.className = "boot-line";
        line.innerHTML = "> " + bootMessages[bootIndex];

        bootLines.appendChild(line);

        bootIndex++;

        progressBar.style.width =
            ((bootIndex / bootMessages.length) * 100) + "%";

        setTimeout(bootSequence, 400);

    } else {

        setTimeout(() => {
            showConsole();
        }, 700);
    }
}

bootSequence();

/* =========================================================
   SCREEN ENGINE
   ========================================================= */

function showScreen(html) {

    app.innerHTML = `
        <div class="screen">
            ${html}
        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    if (window.VanillaTilt) {

        VanillaTilt.init(
            document.querySelectorAll("[data-tilt]"),
            {
                max: 2,
                speed: 500,
                glare: true,
                "max-glare": .05
            }
        );
    }
}

/* =========================================================
   CONSOLE SELECT
   ========================================================= */

function showConsole() {

    showScreen(`

        <div class="kicker">// INITIAL SETUP</div>

        <h1 class="question">
            WHAT CONSOLE DO YOU HAVE?
        </h1>

        <p class="description">
            Select your PlayStation and we'll check the firmware
            path for you. No bullshit, just pick the console.
        </p>

        <div class="buttons">

            <button class="btn green" onclick="selectConsole('ps4')">
                PLAYSTATION 4
                <span class="arrow">→</span>
            </button>

            <button class="btn" onclick="selectConsole('ps5')">
                PLAYSTATION 5
                <span class="arrow">→</span>
            </button>

        </div>

    `);
}

function selectConsole(consoleType) {

    beep();

    if (consoleType === "ps4") {
        showPS4();
    } else {
        showPS5();
    }
}

/* =========================================================
   PS4
   ========================================================= */

function showPS4() {

    showScreen(`

        <div class="kicker">// PLAYSTATION 4</div>

        <h1 class="question">
            WHAT FIRMWARE ARE YOU ON?
        </h1>

        <p class="description">
            We need your PS4 firmware to see which route you
            should take.
        </p>

        <div class="buttons">

            <button class="btn green" onclick="ps4Firmware('compatible')">
                BELOW 13.52
                <span class="arrow">→</span>
            </button>

            <button class="btn" onclick="ps4Firmware('new')">
                13.52 OR HIGHER
                <span class="arrow">→</span>
            </button>

            <button class="btn full" onclick="unknownFirmware('ps4')">
                I DON'T KNOW
                <span class="arrow">?</span>
            </button>

        </div>

        <button class="back" onclick="showConsole()">
            ← BACK
        </button>

    `);
}

function ps4Firmware(type) {

    beep(type === "compatible" ? "success" : "click");

    if (type === "compatible") {
        jailbreakResult("PS4");
    } else {
        servicesQuestion("PS4");
    }
}

/* =========================================================
   PS5
   ========================================================= */

function showPS5() {

    showScreen(`

        <div class="kicker">// PLAYSTATION 5</div>

        <h1 class="question">
            WHAT FIRMWARE ARE YOU ON?
        </h1>

        <p class="description">
            PS5 compatibility currently depends on the firmware
            you're running.
        </p>

        <div class="buttons">

            <button class="btn green" onclick="ps5Firmware('compatible')">
                13.60
                <span class="arrow">→</span>
            </button>

            <button class="btn" onclick="ps5Firmware('new')">
                ABOVE 13.60
                <span class="arrow">→</span>
            </button>

            <button class="btn full" onclick="unknownFirmware('ps5')">
                I DON'T KNOW
                <span class="arrow">?</span>
            </button>

        </div>

        <button class="back" onclick="showConsole()">
            ← BACK
        </button>

    `);
}

function ps5Firmware(type) {

    beep(type === "compatible" ? "success" : "click");

    if (type === "compatible") {
        jailbreakResult("PS5");
    } else {
        servicesQuestion("PS5");
    }
}

/* =========================================================
   UNKNOWN FIRMWARE
   ========================================================= */

function unknownFirmware(consoleType) {

    beep();

    showScreen(`

        <div class="kicker">// FIRMWARE DETECTOR</div>

        <h1 class="question">
            NO PROBLEM.
        </h1>

        <p class="description">
            You can find your firmware directly on your
            ${consoleType.toUpperCase()}.
        </p>

        <div class="info">

            <strong>Go to:</strong><br><br>

            Settings → System → System Information
            <br><br>

            Look for <strong>System Software</strong>.

            <br><br>

            <span class="warning">
                Don't guess it. Check it properly 😂
            </span>

        </div>

        <div class="buttons">

            <button class="btn green" onclick="${consoleType === "ps4" ? "showPS4()" : "showPS5()"}">
                I'LL CHECK IT
                <span class="arrow">→</span>
            </button>

        </div>

        <button class="back" onclick="showConsole()">
            ← BACK
        </button>

    `);
}

/* =========================================================
   JAILBREAK RESULT
   ========================================================= */

function jailbreakResult(consoleType) {

    showScreen(`

        <div class="result-icon">
            ✓
        </div>

        <div class="kicker">// COMPATIBLE PATH FOUND</div>

        <h1 class="question">
            ${consoleType} ROUTE FOUND.
        </h1>

        <p class="description">
            Your selected firmware falls into the route we're
            checking for. Continue to the ModdingXZ host page.
        </p>

        <div class="info">

            <span class="success">
                ● COMPATIBILITY CHECK COMPLETE
            </span>

            <br><br>

            Console:
            <strong>${consoleType}</strong>

            <br>

            ModdingXZ Host:
            <strong>READY</strong>

        </div>

        <div class="buttons">

            <button class="btn green full" onclick="window.location.href='${HOST_URL}'">
                OPEN MODDINGXZ HOSTS
                <span class="arrow">→</span>
            </button>

        </div>

        <button class="back" onclick="showConsole()">
            ← START AGAIN
        </button>

    `);
}

/* =========================================================
   SERVICES
   ========================================================= */

let noCount = 0;

function servicesQuestion(consoleType) {

    showScreen(`

        <div class="kicker">// COMPATIBILITY RESULT</div>

        <h1 class="question">
            THAT FIRMWARE ISN'T ON THE HOST ROUTE.
        </h1>

        <p class="description">
            Are you looking for ModdingXZ services instead?
        </p>

        <div class="buttons">

            <button class="btn green" onclick="servicesResult()">
                YES
                <span class="arrow">→</span>
            </button>

            <button class="btn danger" onclick="noServices()">
                NO
                <span class="arrow">×</span>
            </button>

        </div>

        <button class="back" onclick="${consoleType === "PS4" ? "showPS4()" : "showPS5()"}">
            ← BACK
        </button>

    `);
}

/* =========================================================
   NO ROUTE
   ========================================================= */

function noServices() {

    noCount++;
    beep("error");

    if (noCount === 1) {

        showScreen(`

            <div class="kicker">// OKAY THEN...</div>

            <h1 class="question">
                RIGHT... THEN WHY ARE YOU HERE? 😂
            </h1>

            <p class="description">
                You don't want a jailbreak and you don't want
                services. Interesting.
            </p>

            <div class="buttons">

                <button class="btn danger full" onclick="noServices()">
                    I'M JUST LOOKING
                    <span class="arrow">→</span>
                </button>

            </div>

        `);

        return;
    }

    if (noCount === 2) {

        showScreen(`

            <div class="kicker">// TERMINAL CONFUSED</div>

            <h1 class="question">
                BRO WHAT DO YOU ACTUALLY WANT? 💀
            </h1>

            <p class="description">
                The website has run out of normal questions.
            </p>

            <div class="buttons">

                <button class="btn danger" onclick="noServices()">
                    NOTHING
                    <span class="arrow">→</span>
                </button>

                <button class="btn" onclick="hackerScreen()">
                    IDK LOL
                    <span class="arrow">→</span>
                </button>

            </div>

        `);

        return;
    }

    hackerScreen();
}

/* =========================================================
   SERVICES RESULT
   ========================================================= */

function servicesResult() {

    noCount = 0;
    beep("success");

    showScreen(`

        <div class="result-icon purple">
            XZ
        </div>

        <div class="kicker">// MODDINGXZ SERVICES</div>

        <h1 class="question">
            YOU'RE IN THE RIGHT PLACE.
        </h1>

        <p class="description">
            Head over to the main ModdingXZ website for the
            current services and information.
        </p>

        <div class="info">

            <span class="success">
                ● SERVICES PORTAL READY
            </span>

            <br><br>

            Open the main ModdingXZ website to continue.

        </div>

        <div class="buttons">

            <button class="btn green full" onclick="window.location.href='${SERVICES_URL}'">

/* =========================================================
   IP API
   ========================================================= */

async function lookupVisitor() {

    const ip = document.getElementById("visitor-ip");
    const location = document.getElementById("visitor-location");
    const isp = document.getElementById("visitor-isp");
    const country = document.getElementById("visitor-country");
    const device = document.getElementById("visitor-device");

    try {

        /*
         * ipapi.co is used over HTTPS.
         * It returns the visitor's public IP and approximate
         * network/geographic information.
         */

        const response = await fetch(
            "https://ipapi.co/json/",
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Lookup failed");
        }

        const data = await response.json();

        ip.textContent =
            data.ip || "CLASSIFIED";

        location.textContent =
            [
                data.city,
                data.region
            ]
            .filter(Boolean)
            .join(", ") || "UNKNOWN";

        isp.textContent =
            data.org || "UNKNOWN";

        country.textContent =
            data.country_name || "UNKNOWN";

    } catch (error) {

        /*
         * Fallback.
         */

        ip.textContent = "CLASSIFIED";
        location.textContent = "UNKNOWN";
        isp.textContent = "CLASSIFIED";
        country.textContent = "UNKNOWN";

    }

    device.textContent = detectDevice();
}

/* =========================================================
   DEVICE DETECTION
   ========================================================= */

function detectDevice() {

    const ua = navigator.userAgent.toLowerCase();

    if (ua.includes("android")) {
        return "ANDROID";
    }

    if (ua.includes("iphone")) {
        return "IPHONE";
    }

    if (ua.includes("ipad")) {
        return "IPAD";
    }

    if (ua.includes("windows")) {
        return "WINDOWS";
    }

    if (ua.includes("mac")) {
        return "MAC";
    }

    if (ua.includes("linux")) {
        return "LINUX";
    }

    return "UNKNOWN";
}

/* =========================================================
   MATRIX
   ========================================================= */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let matrixWidth;
let matrixHeight;
let columns;
let drops;

const characters =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&<>[]{}";

function resizeMatrix() {

    matrixWidth = canvas.width = window.innerWidth;
    matrixHeight = canvas.height = window.innerHeight;

    columns = Math.floor(matrixWidth / 15);

    drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] =
            Math.random() * matrixHeight / 15;
    }
}

function drawMatrix() {

    ctx.fillStyle = "rgba(5,3,8,.075)";
    ctx.fillRect(0, 0, matrixWidth, matrixHeight);

    ctx.font = "12px JetBrains Mono";

    for (let i = 0; i < drops.length; i++) {

        const char =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

        /*
         * Deliberately subtle rather than bright neon.
         */

        ctx.fillStyle = "rgba(155,92,255,.75)";

        ctx.fillText(
            char,
            i * 15,
            drops[i] * 15
        );

        if (
            drops[i] * 15 > matrixHeight &&
            Math.random() > .975
        ) {
            drops[i] = 0;
        }

        drops[i] += .65;
    }
}

resizeMatrix();

window.addEventListener(
    "resize",
    resizeMatrix
);

setInterval(
    drawMatrix,
    55
);
