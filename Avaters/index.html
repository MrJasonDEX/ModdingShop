* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--ps-darker);
  color: var(--ps-text);
  font-family: 'Exo 2', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ====== SPLASH / HERO ====== */
#splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--ps-darker);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease, transform 0.6s ease;
}

#splash.hide {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.splash-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.splash-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: orbFloat 6s ease-in-out infinite alternate;
}

.splash-orb.o1 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0,114,206,0.4) 0%, transparent 70%);
  top: -100px; left: -100px;
}
.splash-orb.o2 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(0,194,255,0.3) 0%, transparent 70%);
  bottom: -80px; right: -80px;
  animation-delay: -3s;
}
.splash-orb.o3 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(0,255,136,0.2) 0%, transparent 70%);
  top: 40%; left: 60%;
  animation-delay: -1.5s;
}

@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, -30px) scale(1.1); }
}

.splash-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,114,206,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,114,206,0.05) 1px, transparent 1px);
  background-size: 50px 50px;
}

.splash-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 30px;
}

.ps-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}

.ps-icon {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--ps-blue), var(--ps-accent));
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 30px var(--ps-blue-glow);
  animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { box-shadow: 0 0 20px var(--ps-blue-glow); }
  50% { box-shadow: 0 0 50px var(--ps-blue-glow), 0 0 80px rgba(0,114,206,0.3); }
}

.splash-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: linear-gradient(135deg, #fff 0%, var(--ps-accent) 50%, var(--ps-blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 8px;
}

.splash-sub {
  font-size: 0.85rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--ps-muted);
  margin-bottom: 40px;
}

.splash-stats {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 48px;
}

.stat-item {
  text-align: center;
}

.stat-num {
  font-family: 'Rajdhani', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--ps-accent);
  display: block;
}

.stat-label {
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ps-muted);
}

.enter-btn {
  background: linear-gradient(135deg, var(--ps-blue), var(--ps-accent));
  border: none;
  color: white;
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 16px 48px;
  border-radius: 50px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px var(--ps-blue-glow);
  transition: transform 0.2s, box-shadow 0.2s;
}

.enter-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}

.enter-btn:hover::before { left: 100%; }
.enter-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 48px var(--ps-blue-glow); }
.enter-btn:active { transform: scale(0.97); }

.ps-shapes {
  position: absolute;
  bottom: 40px;
  right: 40px;
  display: flex;
  gap: 16px;
  opacity: 0.3;
}

.shape {
  font-size: 1.5rem;
  animation: shapeFloat 3s ease-in-out infinite alternate;
}

.shape:nth-child(2) { animation-delay: 0.5s; }
.shape:nth-child(3) { animation-delay: 1s; }
.shape:nth-child(4) { animation-delay: 1.5s; }

@keyframes shapeFloat {
  0% { transform: translateY(0); opacity: 0.3; }
  100% { transform: translateY(-8px); opacity: 0.6; }
}

/* ====== MAIN APP ====== */
#app {
  display: none;
  min-height: 100vh;
}

#app.visible { display: block; }

/* Nav */
.app-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,5,8,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--ps-border);
  padding: 12px 16px;
}

.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--ps-accent), var(--ps-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  position: relative;
}

.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ps-muted);
  pointer-events: none;
}

#searchInput {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--ps-border);
  border-radius: 30px;
  color: var(--ps-text);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.9rem;
  padding: 10px 16px 10px 38px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

#searchInput:focus {
  border-color: var(--ps-blue);
  background: rgba(0,114,206,0.08);
}

#searchInput::placeholder { color: var(--ps-muted); }

.nav-count {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.85rem;
  color: var(--ps-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.nav-count span {
  color: var(--ps-accent);
  font-weight: 700;
}

/* Banner */
.app-banner {
  background: linear-gradient(135deg, #0a0a14 0%, #0f1a2e 50%, #0a0f1a 100%);
  padding: 28px 16px;
  text-align: center;
  border-bottom: 1px solid var(--ps-border);
  position: relative;
  overflow: hidden;
}

.banner-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 200px;
  background: radial-gradient(ellipse, rgba(0,114,206,0.15) 0%, transparent 70%);
  pointer-events: none;
}

.banner-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
}

.banner-subtitle {
  font-size: 0.8rem;
  color: var(--ps-muted);
  margin-top: 4px;
  letter-spacing: 1px;
}

/* How to bar */
.how-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  background: rgba(0,114,206,0.08);
  border-bottom: 1px solid rgba(0,114,206,0.2);
  flex-wrap: wrap;
}

.step-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: var(--ps-muted);
  letter-spacing: 0.5px;
}

.step-num {
  width: 18px;
  height: 18px;
  background: var(--ps-blue);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}

.step-arrow {
  color: rgba(255,255,255,0.2);
  font-size: 0.7rem;
}

/* Grid */
.grid-wrap {
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
}

#imageGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

@media (min-width: 480px) {
  #imageGrid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 640px) {
  #imageGrid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 900px) {
  #imageGrid { grid-template-columns: repeat(7, 1fr); }
}

@media (min-width: 1100px) {
  #imageGrid { grid-template-columns: repeat(8, 1fr); }
}

.avatar-card {
  background: var(--ps-card);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  border: 1px solid var(--ps-border);
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), border-color 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
  aspect-ratio: 1;
}

.avatar-card:hover {
  transform: scale(1.06) translateY(-2px);
  border-color: rgba(0,114,206,0.5);
  box-shadow: 0 8px 24px rgba(0,114,206,0.25);
  z-index: 1;
}

.avatar-card:active {
  transform: scale(0.94);
}

.avatar-card.copied {
  border-color: var(--ps-green);
  box-shadow: 0 0 20px rgba(0,255,136,0.4);
}

.avatar-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.avatar-card:hover .card-overlay {
  background: rgba(0,114,206,0.15);
}

.copy-icon {
  opacity: 0;
  font-size: 1.4rem;
  transform: scale(0.5);
  transition: opacity 0.2s, transform 0.2s;
  filter: drop-shadow(0 0 8px rgba(0,194,255,0.8));
}

.avatar-card:hover .copy-icon {
  opacity: 1;
  transform: scale(1);
}

/* Floating CTA */
.float-cta {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 10px;
}

.send-btn {
  background: linear-gradient(135deg, var(--ps-blue), var(--ps-accent));
  border: none;
  border-radius: 50px;
  color: white;
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px 28px;
  cursor: pointer;
  box-shadow: 0 8px 32px var(--ps-blue-glow);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.send-btn:active { transform: scale(0.96); }

.recent-chip-count {
  background: var(--ps-green);
  color: #000;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Recent bar */
.recent-bar {
  position: fixed;
  bottom: 76px;
  left: 0;
  width: 100%;
  z-index: 150;
  pointer-events: none;
  padding: 0 16px;
  overflow: hidden;
}

.recent-inner {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  pointer-events: all;
  scrollbar-width: none;
}

.recent-inner::-webkit-scrollbar { display: none; }

.recent-pill {
  flex-shrink: 0;
  background: rgba(18,18,26,0.95);
  border: 1px solid var(--ps-border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 0.65rem;
  color: var(--ps-muted);
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  backdrop-filter: blur(12px);
  animation: pillIn 0.3s cubic-bezier(.34,1.56,.64,1);
}

@keyframes pillIn {
  from { opacity: 0; transform: translateX(-20px) scale(0.8); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--ps-muted);
}

.empty-state .e-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-state h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--ps-text); }

/* Bottom padding for floating btn */
.bottom-spacer { height: 120px; }

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.avatar-card {
  animation: fadeInUp 0.4s ease both;
}

<script>
  // ---- DATA ----
  let recent = [];
  let recentSet = new Set();

  // ---- SPLASH ----
  document.getElementById('enterBtn').addEventListener('click', function () {
    const splash = document.getElementById('splash');
    const app = document.getElementById('app');
    splash.classList.add('hide');
    app.classList.add('visible');
    setTimeout(() => { splash.style.display = 'none'; }, 700);
  });

  // ---- TELEGRAM ----
  function openTelegram() {
    if (recent.length === 0) {
      Swal.fire({
        title: 'No Avatars Copied Yet',
        text: 'Tap on avatars first to add them to your list!',
        icon: 'info',
        background: '#12121a',
        color: '#e8e8f0',
        confirmButtonColor: '#0072CE',
        confirmButtonText: 'Got it',
        customClass: { popup: 'swal-dark' }
      });
      return;
    }
    const msg = encodeURIComponent("🎮 ModdingShop Avatar Request:\n\n" + recent.join("\n"));
    window.open("https://t.me/ModdingXZ_Support_Bot?start=" + msg);
  }

  // ---- COPY HANDLER ----
  document.addEventListener('click', async (e) => {
    const card = e.target.closest('.avatar-card');
    if (!card) return;

    const name = card.dataset.name;

    try {
      await navigator.clipboard.writeText(name);
    } catch {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = name;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    // Visual
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 800);

    // Recent
    if (!recentSet.has(name)) {
      recentSet.add(name);
      recent.unshift(name);
      if (recent.length > 12) {
        const removed = recent.pop();
        recentSet.delete(removed);
      }
      renderRecent();
    }

    // Toast
    Swal.fire({
      toast: true,
      position: 'top',
      html: `<span style="font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;font-size:0.9rem;">✓ COPIED</span><br><span style="font-size:0.65rem;color:#6b6b8a;word-break:break-all">${name.substring(0, 40)}${name.length > 40 ? '…' : ''}</span>`,
      showConfirmButton: false,
      timer: 1500,
      background: '#12121a',
      color: '#00ff88',
      customClass: {
        popup: 'swal-toast-custom'
      }
    });
  });

  function renderRecent() {
    const bar = document.getElementById('recentBar');
    const countEl = document.getElementById('recentCount');
    bar.innerHTML = recent.map(n =>
      `<div class="recent-pill" title="${n}">${n.replace('.png', '').substring(5, 17)}…</div>`
    ).join('');
    countEl.textContent = recent.length;
    countEl.style.display = recent.length > 0 ? 'flex' : 'none';
  }
</script>
