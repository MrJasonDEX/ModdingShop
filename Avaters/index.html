<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ModdingShop | Premium Modded Avatars</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(180deg, #f8f9fa, #eef1f4);
    }

    .avatar-card {
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .avatar-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .avatar-card.selected {
      border: 2px solid #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.2);
    }

    .avatar-card.selected::before {
      content: "✓";
      position: absolute;
      top: 6px;
      left: 8px;
      background: #0d6efd;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .gallery-img {
      border-radius: 10px;
    }

    #backToTopBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
      z-index: 1050;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <span class="navbar-brand fw-bold">ModdingShop</span>

    <a href="https://t.me/ModdingXZ_Support_Bot" class="btn btn-warning btn-sm">
      Unlock All
    </a>
  </div>
</nav>

<div class="container py-4">

  <!-- HERO -->
  <div class="text-center mb-4">
    <h1 class="fw-bold" id="avatarCount">Loading avatars...</h1>
    <p class="text-muted mb-3">
      Select avatars and send them directly to us.
    </p>

    <a href="https://t.me/ModdingXZ_Support_Bot" class="btn btn-success btn-lg">
      Open Support Bot
    </a>
  </div>

  <!-- STATUS ROW -->
  <div class="row mb-3 text-center">
    <div class="col">
      <span id="selectedCount" class="badge bg-primary fs-6">
        0 selected
      </span>
    </div>
  </div>

  <!-- CONTROLS CARD -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <div class="row g-2 align-items-center">

        <!-- SEARCH -->
        <div class="col-md">
          <input 
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="🔍 Search avatars..."
          >
        </div>

        <!-- FAVORITES -->
        <div class="col-auto">
          <button class="btn btn-outline-warning" id="toggleFavoritesBtn">
            ⭐ Favorites
          </button>
        </div>

      </div>

      <!-- RESULT COUNT -->
      <div id="resultCount" class="small text-muted mt-2"></div>

    </div>
  </div>

  <!-- SEND BUTTON -->
  <div class="d-grid mb-3">
    <button id="sendSelectionBtn" class="btn btn-success btn-lg">
      Send Selected Avatars
    </button>
  </div>

  <!-- GRID -->
  <div class="row g-3" id="imageGrid">
    <div class="d-flex justify-content-center align-items-center" style="height:200px;">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>

</div>

<!-- BACK TO TOP -->
<button class="btn btn-primary rounded-circle" id="backToTopBtn">
  ↑
</button>

<!-- FOOTER -->
<footer class="bg-light text-center py-3 border-top">
  <small class="text-muted">&copy; 2026 ModdingShop</small>
</footer>

<!-- JS -->
<script src="main.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const btn = document.getElementById('backToTopBtn');

  window.addEventListener('scroll', () => {
    btn.style.display = window.scrollY > 200 ? 'block' : 'none';
  });

  btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>

</body>
</html>
