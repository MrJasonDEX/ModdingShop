<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ModdingShop | Premium Modded Avatars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #0d6efd;
      --accent: #ffc107;
    }

    body {
      background: linear-gradient(180deg, #f8f9fa, #eef1f4);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      transition: all 0.2s ease;
    }

    /* NAVBAR */
    .navbar {
      backdrop-filter: blur(10px);
    }

    /* HERO */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-weight: 700;
    }

    /* CTA */
    .cta-btn {
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 600;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      border-radius: 12px;
      padding: 10px;
    }

    /* RESULT COUNT */
    #resultCount {
      font-size: 0.9rem;
      color: #6c757d;
      margin-bottom: 10px;
    }

    /* CARD */
    .avatar-card {
      background: #fff;
      border-radius: 14px;
      padding: 8px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* SELECTED */
    .avatar-card.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px rgba(13,110,253,0.2);
    }

    .avatar-card.selected::before {
      content: "✓";
      position: absolute;
      top: 8px;
      left: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* IMAGE */
    .gallery-img {
      width: 100%;
      border-radius: 10px;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    /* FAVORITES BUTTON (kept safe) */
    .favorite-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      border: none;
      background: none;
    }

    .favorite-star {
      font-size: 1.4em;
      color: #ccc;
    }

    /* BACK TO TOP */
    #backToTopBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      opacity: 0;
      transform: translateY(10px);
      z-index: 1050;
    }

    #backToTopBtn.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* MOBILE */
    @media (max-width: 576px) {
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">ModdingShop</span>

    <a href="https://t.me/ModdingXZ_Support_Bot" class="btn btn-warning btn-sm">
      Unlock All
    </a>
  </div>
</nav>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <h1 id="avatarCount">Loading avatars...</h1>
    <p class="text-muted">Select avatars and send them to us instantly.</p>

    <a href="https://t.me/ModdingXZ_Support_Bot" class="btn btn-success cta-btn">
      Open Support Bot
    </a>
  </div>

  <!-- SELECTED COUNT -->
  <div class="text-center mb-2">
    <span id="selectedCount" class="badge bg-primary">0 selected</span>
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <input 
      type="text"
      id="searchInput"
      class="form-control search-box"
      placeholder="🔍 Search avatars..."
    >

    <button class="btn btn-outline-warning btn-sm" id="toggleFavoritesBtn">
      ⭐ Favorites
    </button>

  </div>

  <!-- RESULT COUNT -->
  <div id="resultCount"></div>

  <!-- SEND BUTTON -->
  <div class="text-center mb-3">
    <button id="sendSelectionBtn" class="btn btn-success cta-btn">
      Send Selected Avatars
    </button>
  </div>

  <!-- GRID -->
  <div class="row g-4" id="imageGrid">
    <div class="d-flex justify-content-center align-items-center" style="height:200px;">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>

</div>

<!-- BACK TO TOP -->
<button class="btn btn-primary rounded-circle shadow" id="backToTopBtn">
  ↑
</button>

<!-- FOOTER -->
<footer class="bg-light text-center py-3 border-top mt-4">
  <small class="text-muted">&copy; 2026 ModdingShop</small>
</footer>

<!-- ✅ KEEP YOUR ORIGINAL JS FILE -->
<script src="main.js" defer></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const btn = document.getElementById('backToTopBtn');

  window.addEventListener('scroll', () => {
    btn.classList.toggle('show', window.scrollY > 200);
  });

  btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>

</body>
</html>
