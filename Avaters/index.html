<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ModdingShop — PSN Avatars</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      --ps-blue: #0072CE;
      --ps-blue-glow: rgba(0,114,206,0.6);
      --ps-darker: #050508;
      --ps-card: #12121a;
      --ps-border: rgba(255,255,255,0.07);
      --ps-text: #e8e8f0;
      --ps-muted: #6b6b8a;
      --ps-accent: #00c2ff;
      --ps-green: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ps-darker);
      color: var(--ps-text);
      font-family: 'Exo 2', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ====== SPLASH SCREEN ====== */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--ps-darker);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-bg { position: absolute; inset: 0; overflow: hidden; opacity: 0.5; }
    .splash-orb { position: absolute; border-radius: 50%; filter: blur(80px); background: radial-gradient(circle, var(--ps-blue) 0%, transparent 70%); width: 400px; height: 400px; top: -100px; left: -100px; }
    
    .splash-content { position: relative; z-index: 10; text-align: center; }
    .splash-title { font-family: 'Rajdhani'; font-size: 3.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(to bottom, #fff, var(--ps-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .splash-sub { color: var(--ps-muted); letter-spacing: 2px; font-size: 0.9rem; margin-top: 5px; }

    .enter-btn {
      margin-top: 30px; background: linear-gradient(135deg, var(--ps-blue), var(--ps-accent));
      border: none; color: white; padding: 16px 45px; border-radius: 50px;
      font-family: 'Rajdhani'; font-weight: 700; font-size: 1.1rem; cursor: pointer;
      box-shadow: 0 10px 30px var(--ps-blue-glow);
    }

    /* ====== APP MAIN UI ====== */
    #app { display: none; }
    #app.visible { display: block; }

    .app-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(5,5,8,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--ps-border); padding: 12px 16px;
    }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .search-wrap { flex: 1; position: relative; }
    #searchInput {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--ps-border);
      border-radius: 30px; color: white; padding: 12px 15px 12px 40px; outline: none;
      font-size: 1rem;
    }

    .how-bar {
      display: flex; justify-content: center; gap: 15px; padding: 15px;
      background: rgba(0,114,206,0.05); font-size: 0.75rem; color: var(--ps-muted);
      border-bottom: 1px solid var(--ps-border);
    }
    .step-num { color: var(--ps-accent); font-weight: 700; }

    /* ====== AVATAR GRID ====== */
    .grid-wrap { padding: 15px; max-width: 1400px; margin: 0 auto; min-height: 100vh; }
    #imageGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    
    @media (min-width: 768px) { #imageGrid { grid-template-columns: repeat(6, 1fr); } }

    .avatar-card {
      background: var(--ps-card); border-radius: 12px; aspect-ratio: 1;
      overflow: hidden; border: 1px solid var(--ps-border); cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .avatar-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .avatar-card:active { transform: scale(0.95); }
    .avatar-card.copied { border: 2px solid var(--ps-green); box-shadow: 0 0 15px rgba(0,255,136,0.3); }

    /* ====== BOTTOM UI ====== */
    .recent-bar {
      position: fixed; bottom: 90px; left: 0; width: 100%; z-index: 100;
      padding: 0 16px; pointer-events: none;
    }
    .recent-inner { 
      display: flex; gap: 8px; overflow-x: auto; pointer-events: all; 
      padding-bottom: 10px; scrollbar-width: none; 
    }
    .recent-pill {
      background: rgba(18,18,26,0.95); border: 1px solid var(--ps-border);
      padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; color: var(--ps-accent);
      white-space: nowrap; backdrop-filter: blur(10px);
    }

    .float-cta { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1100; width: 90%; max-width: 420px; }
    .send-btn {
      width: 100%; background: linear-gradient(135deg, var(--ps-blue), var(--ps-accent));
      border: none; color: white; padding: 18px; border-radius: 50px;
      font-family: 'Rajdhani'; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      font-size: 1.1rem;
    }
    .recent-chip-count { 
      background: white; color: var(--ps-blue); 
      width: 24px; height: 24px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 0.8rem; font-weight: 800;
    }

    .loader-msg { text-align: center; padding: 50px; color: var(--ps-muted); font-weight: 600; }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-bg"><div class="splash-orb"></div></div>
    <div class="splash-content">
      <h1 class="splash-title">ModdingShop</h1>
      <p class="splash-sub">OVER 5,000 PREMIUM AVATARS</p>
      <button class="enter-btn" id="enterBtn">Open Catalog</button>
    </div>
  </div>

  <div id="app">
    <nav class="app-nav">
      <div class="nav-inner">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search by ID...">
        </div>
      </div>
    </nav>

    <div class="how-bar">
      <div><span class="step-num">1</span> Tap to Pick</div>
      <div><span class="step-num">2</span> Collect IDs</div>
      <div><span class="step-num">3</span> Send to Bot</div>
    </div>

    <div class="grid-wrap">
      <div id="imageGrid"></div>
      <div id="loader" class="loader-msg">Scrolling for more...</div>
      <div style="height: 180px;"></div> </div>

    <div class="recent-bar">
      <div class="recent-inner" id="recentBar"></div>
    </div>

    <div class="float-cta">
      <button class="send-btn" onclick="openTelegram()">
        <span>Message Support</span>
        <div class="recent-chip-count" id="recentCount">0</div>
      </button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
