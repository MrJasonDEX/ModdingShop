<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Avatar Picker</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Animate -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --accent: #0d6efd;
    }

    body {
      background: #eef1f4;
      font-family: system-ui;
      padding-bottom: 80px;
    }

    /* 🔥 PREMIUM HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 1050;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    /* SEARCH */
    .search-box {
      border-radius: 12px;
      border: none;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* GRID */
    .avatar-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .avatar-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .avatar-card:active {
      transform: scale(0.95);
    }

    /* IMAGE */
    .gallery-img {
      width: 100%;
      display: block;
    }

    /* NAME */
    .avatar-name {
      font-size: 0.7rem;
      padding: 6px;
      text-align: center;
      word-break: break-all;
      color: #555;
    }

    /* COPIED EFFECT */
    .avatar-card.copied {
      border: 2px solid #198754;
      box-shadow: 0 0 0 3px rgba(25,135,84,0.2);
    }

    /* FLOAT TIP */
    .floating-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      opacity: 0.9;
    }

    /* RESULT TEXT */
    .meta-bar {
      font-size: 0.8rem;
      color: #666;
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- 🔥 HEADER -->
<div class="app-header">
  <div class="container">

    <input 
      type="text"
      id="searchInput"
      class="form-control search-box"
      placeholder="🔍 Search avatars..."
    >

    <div class="meta-bar">
      <span id="resultCount"></span>
      <span class="text-success fw-bold">Tap to copy</span>
    </div>

  </div>
</div>

<!-- GRID -->
<div class="container mt-2">
  <div class="row g-3" id="imageGrid">
    <div class="text-center py-5">
      <div class="spinner-border"></div>
    </div>
  </div>
</div>

<!-- FLOAT BAR -->
<div class="floating-bar">
  Tap avatar → name copied
</div>

<!-- YOUR SCRIPT -->
<script src="main.js" defer></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("click", async (e) => {
    const card = e.target.closest(".avatar-card");
    if (!card) return;

    const name = card.dataset.name;
    if (!name) return;

    try {
      await navigator.clipboard.writeText(name);

      // visual feedback
      card.classList.add("copied", "animate__animated", "animate__pulse");

      setTimeout(() => {
        card.classList.remove("copied", "animate__pulse");
      }, 600);

      // premium toast
      Swal.fire({
        toast: true,
        position: 'bottom',
        icon: 'success',
        title: 'Copied',
        text: name,
        showConfirmButton: false,
        timer: 1200,
        background: '#111',
        color: '#fff'
      });

    } catch {
      Swal.fire({
        icon: 'error',
        title: 'Copy failed'
      });
    }
  });
</script>

</body>
</html>
