<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Modded Avatars Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="main.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ModdingShop Avatars</a>
    </div>
  </nav>

  <div class="container pb-4">
    <h1 class="text-center mb-4 display-5 fw-semibold">6,288 Premium Modded Avatars</h1>

    <!-- Search Card -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <input type="text" class="form-control search-box" id="searchInput" placeholder="🔍 Search avatars by name, style, or tag...">
          </div>
        </div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="row g-4" id="imageGrid">
      <!-- Images will be loaded here by main.js -->
      <div class="d-flex justify-content-center align-items-center" id="loadingSpinner" style="height:200px;">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading avatars...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-auto border-top">
    <small class="text-muted">&copy; 2024 ModdingShop. All rights reserved.</small>
  </footer>

  <script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
