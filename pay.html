
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08060d">

    <title>MODDING XZ // EMBEDDED HOST</title>

    <link rel="icon" href="https://moddingxz.co.uk/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #08060d;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            background: #100b18;
            border-bottom: 1px solid #352044;
            padding: 17px 20px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: #b66cff;
            letter-spacing: 2px;
        }

        .brand span {
            color: #fff;
        }

        .main {
            max-width: 1500px;
            margin: auto;
            padding: 25px 15px;
        }

        .heading {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 4vw, 30px);
            font-weight: 700;
        }

        .subtitle {
            color: #a59aaa;
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #b8f5c8;
            background: #102319;
            border: 1px solid #245537;
            border-radius: 30px;
            padding: 7px 13px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #36db75;
            border-radius: 50%;
        }

        .embed-container {
            margin-top: 22px;
            background: #110d17;
            border: 1px solid #38234b;
            border-radius: 13px;
            padding: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px #0008;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 600px;
            border: none;
            border-radius: 8px;
            background: #fff;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 17px;
        }

        .btn-purple {
            background: #873bd1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-purple:hover {
            background: #a45bea;
            color: white;
        }

        .btn-outline {
            background: transparent;
            color: #d9b5ff;
            border: 1px solid #70419a;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .btn-outline:hover {
            background: #21132e;
            color: white;
        }

        footer {
            border-top: 1px solid #281b34;
            margin-top: 35px;
            padding: 20px;
            text-align: center;
            color: #776d80;
            font-size: 11px;
        }

        footer span {
            color: #b66cff;
            font-weight: 700;
        }

        @media(max-width: 600px) {
            .main {
                padding: 20px 10px;
            }

            iframe {
                height: 75vh;
                min-height: 500px;
            }

            .embed-container {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="container-fluid">

            <a class="brand text-decoration-none" href="https://moddingxz.co.uk/">
                MODDING <span>XZ</span>
            </a>

            <span class="text-secondary small">
                COMMUNITY HOST
            </span>

        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

            <div>
                <h1 class="heading mb-2">
                    EMBEDDED HOST
                </h1>

                <p class="subtitle mb-0">
                    External host loaded directly through ModdingXZ.
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                HOST READY
            </div>

        </div>

        <!-- EMBEDDED WEBSITE -->
        <div class="embed-container">

            <iframe
                id="hostFrame"
                src="https://screensnaps.top/734LV3"
                title="ModdingXZ Embedded Host"
                allowfullscreen
                loading="eager">
            </iframe>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="actions">

            <button class="btn-purple" onclick="reloadHost()">
                ↻ Reload Host
            </button>

            <a
                class="btn-outline"
                href="https://screensnaps.top/734LV3"
                target="_blank"
                rel="noopener noreferrer">
                ↗ Open Full Page
            </a>

            <a
                class="btn-outline"
                href="https://moddingxz.co.uk/">
                ← Back to ModdingXZ
            </a>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        POWERED BY <span>MODDING XZ</span>
        <br><br>
        © 2026 ModdingXZ. All rights reserved.
    </footer>

    <script>
        function reloadHost() {
            const frame = document.getElementById('hostFrame');
            frame.src = frame.src;
        }
    </script>

</body>
</html>
