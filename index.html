<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ModdingXZ Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#020202;
color:white;
font-family:'Segoe UI',sans-serif;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:230px;
background:#000;
height:100vh;
padding:20px;
border-right:1px solid #111;
position:fixed;
}

.sidebar h3{
color:#00ffc8;
}

.sidebar button{
width:100%;
margin-top:10px;
background:none;
border:none;
color:white;
text-align:left;
padding:10px;
border-radius:8px;
}

.sidebar button:hover{
background:#111;
}

/* CONTENT */
.content{
margin-left:230px;
padding:30px;
width:100%;
}

/* CARD */
.card-neon{
background:#0a0a0a;
padding:20px;
border-radius:15px;
border:1px solid #111;
margin-bottom:20px;
}

.card-neon:hover{
border-color:#00ffc8;
}

/* BUTTON */
.btn-neon{
background:linear-gradient(90deg,#00ffc8,#00aaff);
border:none;
border-radius:20px;
padding:10px 20px;
}

/* LIVE */
.live{
position:fixed;
bottom:20px;
left:20px;
background:#111;
padding:10px 15px;
border-radius:20px;
display:none;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>ModdingXZ</h3>

<button onclick="showPage('shop')">🛒 Shop</button>
<button onclick="showPage('orders')">📦 Orders</button>
<button onclick="showPage('account')">👤 Account</button>

<hr>

<a href="https://t.me/ModdingXZ_Support_Bot" class="btn btn-neon w-100">Support</a>

</div>

<!-- CONTENT -->
<div class="content">

<div id="shop">

<h2>Shop</h2>

<div class="card-neon">
<h4>COD Max Package</h4>
<p>Full progression bundle</p>
<b>£15</b><br>
<button class="btn btn-neon mt-2" onclick="openOrder('COD Max Package',15)">Order</button>
</div>

<div class="card-neon">
<h4>BO3 Ultimate</h4>
<p>Unlock all + prestige</p>
<b>£15</b><br>
<button class="btn btn-neon mt-2" onclick="openOrder('BO3 Ultimate',15)">Order</button>
</div>

</div>

<div id="orders" style="display:none;">
<h2>Your Orders</h2>
<div id="orderList"></div>
</div>

<div id="account" style="display:none;">
<h2>Account</h2>

<input id="savedUser" class="form-control" placeholder="PSN Username">
<button class="btn btn-neon mt-2" onclick="saveUser()">Save</button>

</div>

</div>

<!-- MODAL -->
<div class="modal fade" id="orderModal">
<div class="modal-dialog">
<div class="modal-content p-4 bg-dark">

<h4>Confirm Order</h4>

<input id="username" class="form-control mt-2" placeholder="PSN Username">

<button class="btn btn-neon mt-3" onclick="submitOrder()">Submit</button>

</div>
</div>
</div>

<div class="live" id="live"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* NAV */
function showPage(page){
document.getElementById("shop").style.display="none";
document.getElementById("orders").style.display="none";
document.getElementById("account").style.display="none";

document.getElementById(page).style.display="block";
}

/* ACCOUNT */
function saveUser(){
localStorage.setItem("user", document.getElementById("savedUser").value);
alert("Saved");
}

/* LOAD USER */
window.onload = ()=>{
let user = localStorage.getItem("user");
if(user){
document.getElementById("savedUser").value = user;
document.getElementById("username").value = user;
}
loadOrders();
}

/* ORDER */
let currentService="";
let currentPrice="";

function openOrder(name,price){
currentService=name;
currentPrice=price;
new bootstrap.Modal(document.getElementById('orderModal')).show();
}

function submitOrder(){

let user=document.getElementById("username").value;

let order={
service:currentService,
price:currentPrice,
user:user,
date:new Date().toLocaleString()
};

let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));

let msg=encodeURIComponent(`Order: ${currentService} | ${user}`);
window.location.href=`https://t.me/ModdingXZ_Support_Bot?start=${msg}`;

}

/* LOAD ORDERS */
function loadOrders(){
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
let html="";
orders.forEach(o=>{
html+=`<div class="card-neon">${o.service} - £${o.price}<br>${o.date}</div>`;
});
document.getElementById("orderList").innerHTML=html;
}

/* LIVE */
const buyers=["Someone bought BO3","User bought IPTV","Client bought COD"];

setInterval(()=>{
let box=document.getElementById("live");
box.innerText=buyers[Math.floor(Math.random()*buyers.length)];
box.style.display="block";
setTimeout(()=>box.style.display="none",3000);
},10000);

</script>

</body>
</html>
